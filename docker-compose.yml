services:
  db:
    image: postgres:15-alpine
    container_name: adsicrm-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-adsicrm_database}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  db-admin:
    image: adminer:latest
    container_name: adsicrm-adminer
    restart: always
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8978}:8080"
    volumes:
      - ./src/common/adminer.css:/var/www/html/adminer.css:ro
    depends_on:
      - db

  redis:
    image: redis:7-alpine
    container_name: adsicrm-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: adsicrm-docker-proxy
    restart: always
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  backend:
    image: ghcr.io/adsicrm/adsicrm-backend:1.0.9
    platform: linux/amd64
    container_name: adsicrm-backend
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3000}:3000"
    volumes:
      - backend_storage:/app/storage
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - db
      - redis
      - docker-socket-proxy

  frontend:
    image: ghcr.io/adsicrm/adsicrm-frontend:0.1.8
    platform: linux/amd64
    container_name: adsicrm-frontend
    restart: always
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    environment:
      INTERNAL_API_URL: http://backend:3000
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:
  backend_storage:
